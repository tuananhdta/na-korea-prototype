  <path d="M0,200 Q360,130 720,180 T1440,150" stroke="url(#goldStrokePlum)" stroke-width="2" fill="none" opacity="0.75"/>

  <!-- Front Mountain Ridge -->
  <path d="M0,245 Q280,195 560,230 T1120,210 Q1280,240 1440,225 L1440,320 L0,320 Z" fill="url(#plumGrad3)"/>
  <path d="M0,245 Q280,195 560,230 T1120,210 Q1280,240 1440,225" stroke="url(#goldStrokePlum)" stroke-width="1.8" fill="none" opacity="0.9"/>
